<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banking homework</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><h1 id="title">Banking homework</h1><p>Ten collections, one scenario-driven CRUD app. Synthetic classroom data only.</p></header>
  <main>
    <p id="message" role="status" aria-live="polite">Connecting to MongoDB...</p>
    <label for="entity">Collection</label> <select id="entity" disabled></select>
    <button id="refresh" type="button" disabled>Refresh</button>
    <div class="layout">
      <section><h2 id="form-title">Create record</h2>
        <form id="record-form"><div id="fields"></div><button id="save" disabled>Save</button> <button id="cancel" type="button">New record / Cancel</button></form>
      </section>
      <section class="records"><h2>Stored records</h2><p>IDs are entered manually and remain fixed. Relationship fields select existing records.</p><div class="scroll"><table id="records"></table></div></section>
    </div>
  </main>
</body>
</html>
